<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Efficommerce | Devoluciones</title>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --blue:       #2563eb;
            --blue-light: #eff6ff;
            --blue-mid:   #dbeafe;
            --blue-dark:  #1d4ed8;
            --green:      #059669;
            --green-light:#ecfdf5;
            --red:        #dc2626;
            --red-light:  #fef2f2;
            --amber:      #d97706;
            --amber-light:#fffbeb;
            --gray-50:    #f8fafc;
            --gray-100:   #f1f5f9;
            --gray-200:   #e2e8f0;
            --gray-300:   #cbd5e1;
            --gray-400:   #94a3b8;
            --gray-500:   #64748b;
            --gray-600:   #475569;
            --gray-700:   #334155;
            --gray-900:   #0f172a;
            --white:      #ffffff;
            --sans:       'Plus Jakarta Sans', sans-serif;
            --mono:       'IBM Plex Mono', monospace;
            --shadow-sm:  0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
            --shadow:     0 4px 16px rgba(0,0,0,0.07), 0 1px 4px rgba(0,0,0,0.04);
            --shadow-md:  0 8px 24px rgba(0,0,0,0.09), 0 2px 8px rgba(0,0,0,0.05);
            --radius:     12px;
            --radius-lg:  18px;
        }

        *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

        body {
            font-family: var(--sans);
            background: var(--gray-50);
            color: var(--gray-900);
            line-height: 1.55;
            min-height: 100vh;
        }

        /* ── NAVBAR ── */
        .navbar {
            background: var(--white);
            border-bottom: 1px solid var(--gray-200);
            position: sticky; top: 0; z-index: 100;
            box-shadow: var(--shadow-sm);
        }
        .nav-inner {
            max-width: 1440px; margin: 0 auto;
            padding: 0 28px; height: 60px;
            display: flex; align-items: center; justify-content: space-between; gap: 16px;
        }
        .brand { display: flex; align-items: center; gap: 12px; }
        .brand-logo { height: 30px; width: auto; }
        .brand-sep { width: 1px; height: 18px; background: var(--gray-200); }
        .brand-chip {
            background: var(--blue-light);
            color: var(--blue);
            border: 1px solid var(--blue-mid);
            padding: 3px 12px; border-radius: 999px;
            font-size: 0.7rem; font-weight: 600;
            letter-spacing: 0.04em;
        }
        .nav-status {
            display: flex; align-items: center; gap: 6px;
            font-size: 0.72rem; color: var(--gray-400);
            font-family: var(--mono);
        }
        .status-dot {
            width: 7px; height: 7px; border-radius: 50%;
            background: var(--green);
            box-shadow: 0 0 0 2px var(--green-light);
        }

        /* ── LAYOUT ── */
        .wrap {
            max-width: 1440px; margin: 0 auto;
            padding: 28px 28px 60px;
        }

        /* ── CARD ── */
        .card {
            background: var(--white);
            border: 1px solid var(--gray-200);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-sm);
            margin-bottom: 18px;
            overflow: hidden;
            transition: box-shadow 0.2s;
        }
        .card:hover { box-shadow: var(--shadow); }

        .card-head {
            padding: 13px 22px;
            border-bottom: 1px solid var(--gray-100);
            background: var(--gray-50);
            display: flex; align-items: center; gap: 10px;
        }
        .card-head-icon {
            width: 7px; height: 7px; border-radius: 50%;
            background: var(--blue);
        }
        .card-head-label {
            font-size: 0.68rem; font-weight: 600;
            color: var(--gray-500);
            text-transform: uppercase; letter-spacing: 0.08em;
        }
        .card-body { padding: 20px 24px; }

        /* ── SCANNER ── */
        .scan-row { display: flex; gap: 10px; flex-wrap: wrap; }

        .scan-input {
            flex: 2; min-width: 200px;
            padding: 13px 18px;
            font-family: var(--mono); font-size: 0.95rem;
            color: var(--gray-900);
            background: var(--white);
            border: 1.5px solid var(--gray-200);
            border-radius: var(--radius);
            outline: none;
            transition: all 0.18s;
        }
        .scan-input::placeholder { color: var(--gray-300); }
        .scan-input:focus {
            border-color: var(--blue);
            box-shadow: 0 0 0 3px rgba(37,99,235,0.10);
        }

        /* ── BUTTONS ── */
        .btn {
            padding: 12px 22px; border-radius: 999px;
            font-family: var(--sans); font-weight: 600; font-size: 0.80rem;
            border: none; cursor: pointer;
            display: inline-flex; align-items: center; gap: 7px;
            white-space: nowrap;
            transition: all 0.18s;
        }
        .btn:active { transform: scale(0.97); }

        .btn-primary {
            background: var(--blue); color: var(--white);
            box-shadow: 0 2px 8px rgba(37,99,235,0.25);
        }
        .btn-primary:hover {
            background: var(--blue-dark);
            box-shadow: 0 4px 14px rgba(37,99,235,0.35);
            transform: translateY(-1px);
        }

        .btn-ghost {
            background: var(--white); color: var(--gray-600);
            border: 1.5px solid var(--gray-200);
        }
        .btn-ghost:hover {
            background: var(--gray-50);
            border-color: var(--gray-300);
            color: var(--gray-700);
        }

        .btn-green {
            background: var(--green); color: var(--white);
            box-shadow: 0 2px 8px rgba(5,150,105,0.2);
        }
        .btn-green:hover {
            background: #047857;
            box-shadow: 0 4px 14px rgba(5,150,105,0.3);
            transform: translateY(-1px);
        }

        .btn-red {
            background: var(--white); color: var(--red);
            border: 1.5px solid var(--gray-200);
        }
        .btn-red:hover {
            background: var(--red-light);
            border-color: #fca5a5;
        }

        .btn-outline {
            background: var(--white); color: var(--gray-600);
            border: 1.5px solid var(--gray-200);
        }
        .btn-outline:hover {
            border-color: var(--blue);
            color: var(--blue);
            background: var(--blue-light);
        }

        /* ── LAST SCAN ── */
        .scan-fields {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
        }
        .sf {
            padding: 18px 22px;
            border-right: 1px solid var(--gray-100);
        }
        .sf:last-child { border-right: none; }
        .sf-label {
            font-size: 0.60rem; font-weight: 600;
            text-transform: uppercase; letter-spacing: 0.10em;
            color: var(--gray-400); margin-bottom: 6px;
        }
        .sf-value {
            font-size: 0.86rem; font-weight: 500;
            color: var(--gray-800); word-break: break-word;
        }
        .sf-value.is-guia {
            font-family: var(--mono); font-size: 1rem;
            color: var(--blue);
            background: var(--blue-light);
            padding: 3px 10px; border-radius: 6px;
            display: inline-block;
        }

        /* ── BADGE ── */
        .badge {
            display: inline-flex; align-items: center; gap: 5px;
            padding: 4px 12px; border-radius: 999px;
            font-size: 0.70rem; font-weight: 600; border: 1px solid;
        }
        .badge-ok   { background: var(--green-light); color: #065f46; border-color: #a7f3d0; }
        .badge-pend { background: var(--amber-light); color: #92400e; border-color: #fcd34d; }

        /* ── ACTIONS + STATS ── */
        .actions-bar {
            display: flex; justify-content: space-between;
            align-items: center; flex-wrap: wrap; gap: 16px;
        }
        .btn-group { display: flex; gap: 8px; flex-wrap: wrap; }

        .stats-strip {
            display: flex; gap: 0;
            border: 1.5px solid var(--gray-200);
            border-radius: var(--radius);
            overflow: hidden;
            background: var(--white);
        }
        .stat {
            padding: 12px 24px; text-align: center;
            position: relative;
        }
        .stat + .stat {
            border-left: 1px solid var(--gray-100);
        }
        .stat-n {
            display: block;
            font-family: var(--mono); font-size: 1.55rem; font-weight: 500;
            color: var(--gray-900); line-height: 1.15;
        }
        .stat-n.clr-green { color: var(--green); }
        .stat-n.clr-amber { color: var(--amber); }
        .stat-lbl {
            display: block; font-size: 0.60rem; font-weight: 600;
            text-transform: uppercase; letter-spacing: 0.09em;
            color: var(--gray-400); margin-top: 3px;
        }

        /* ── PROGRESS ── */
        .progress-row {
            margin-top: 14px;
            display: flex; align-items: center; gap: 12px;
        }
        .progress-track {
            flex: 1; height: 5px; border-radius: 999px;
            background: var(--gray-100); overflow: hidden;
        }
        .progress-bar {
            height: 100%; border-radius: 999px;
            background: linear-gradient(90deg, var(--blue), #60a5fa);
            transition: width 0.45s cubic-bezier(.4,0,.2,1);
            width: 0%;
        }
        .progress-pct {
            font-family: var(--mono); font-size: 0.68rem; font-weight: 500;
            color: var(--gray-500); min-width: 34px; text-align: right;
        }

        /* ── TABLE ── */
        .tbl-wrap {
            overflow-x: auto; overflow-y: auto;
            max-height: 460px;
            border: 1px solid var(--gray-200);
            border-radius: var(--radius);
        }
        .tbl-wrap::-webkit-scrollbar { width: 6px; height: 6px; }
        .tbl-wrap::-webkit-scrollbar-track { background: var(--gray-50); }
        .tbl-wrap::-webkit-scrollbar-thumb { background: var(--gray-200); border-radius: 99px; }

        table { width: 100%; border-collapse: collapse; font-size: 0.78rem; }
        thead { position: sticky; top: 0; z-index: 10; }

        th {
            text-align: left; padding: 11px 13px;
            background: var(--gray-50);
            font-weight: 600; font-size: 0.68rem;
            color: var(--gray-500);
            text-transform: uppercase; letter-spacing: 0.06em;
            border-bottom: 1.5px solid var(--gray-200);
            white-space: nowrap;
        }
        td {
            padding: 10px 13px;
            border-bottom: 1px solid var(--gray-100);
            color: var(--gray-600); white-space: nowrap;
        }
        tr:last-child td { border-bottom: none; }
        tr:hover td { background: var(--gray-50); color: var(--gray-900); }

        .row-dev td { background: #f0fdf9; color: var(--gray-700); }
        .row-dev:hover td { background: #dcfdf2; }

        .chk {
            width: 15px; height: 15px; cursor: pointer;
            accent-color: var(--blue);
        }

        /* empty */
        .empty { text-align: center; padding: 64px 24px; }
        .empty-ico { font-size: 2.4rem; opacity: 0.3; margin-bottom: 12px; }
        .empty-t { font-size: 0.85rem; color: var(--gray-500); margin-bottom: 4px; font-weight: 500; }
        .empty-s { font-family: var(--mono); font-size: 0.70rem; color: var(--gray-300); }

        /* ── LOG ── */
        .log-wrap {
            margin-top: 16px;
            background: #0f172a;
            border-radius: var(--radius);
            overflow: hidden;
        }
        .log-head {
            padding: 10px 16px;
            border-bottom: 1px solid rgba(255,255,255,0.06);
            display: flex; align-items: center; gap: 8px;
        }
        .log-head-lbl {
            font-family: var(--mono); font-size: 0.60rem; font-weight: 500;
            letter-spacing: 0.10em; text-transform: uppercase;
            color: #475569;
        }
        .log-body {
            padding: 10px 14px;
            max-height: 160px; overflow-y: auto;
        }
        .log-body::-webkit-scrollbar { width: 3px; }
        .log-body::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 99px; }
        .log-row {
            font-family: var(--mono); font-size: 0.66rem; line-height: 1.5;
            color: #334155; padding: 4px 0;
            border-bottom: 1px solid rgba(255,255,255,0.025);
        }
        .log-row:last-child { border-bottom: none; }
        .log-ts  { color: #1e293b; }
        .log-ok  { color: #10b981; }
        .log-er  { color: #f43f5e; }
        .log-gu  { color: #3b82f6; }

        /* ── TOAST ── */
        .toast {
            position: fixed; bottom: 26px; right: 26px; z-index: 9999;
            padding: 11px 20px; border-radius: 999px;
            font-family: var(--sans); font-size: 0.80rem; font-weight: 600;
            display: flex; align-items: center; gap: 8px; max-width: 360px;
            border: 1px solid;
            animation: toastUp 0.3s cubic-bezier(.34,1.56,.64,1) both;
            box-shadow: var(--shadow-md);
        }
        @keyframes toastUp {
            from { transform: translateY(16px) scale(0.92); opacity: 0; }
            to   { transform: translateY(0) scale(1); opacity: 1; }
        }
        .toast-ok  { background: var(--green-light); color: #065f46; border-color: #a7f3d0; }
        .toast-err { background: var(--red-light);   color: var(--red);   border-color: #fca5a5; }
        .toast-inf { background: var(--blue-light);  color: var(--blue);  border-color: var(--blue-mid); }

        /* ── RESPONSIVE ── */
        @media(max-width:768px){
            .wrap { padding: 18px 14px 50px; }
            .nav-inner { padding: 0 18px; }
            .card-body { padding: 16px 18px; }
            .sf { padding: 14px 16px; }
            .scan-fields { grid-template-columns: 1fr 1fr; }
            .nav-status { display: none; }
        }
        @media(max-width:480px){
            .scan-fields { grid-template-columns: 1fr; }
            .stats-strip { width: 100%; }
        }
    </style>
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar">
    <div class="nav-inner">
        <div class="brand">
            <img src="https://effi.com.co/public/images/logos/Logo-Efficommerce-H.png"
                 alt="Efficommerce" class="brand-logo"
                 onerror="this.style.display='none'">
            <div class="brand-sep"></div>
            <span class="brand-chip">Devoluciones</span>
        </div>
        <div class="nav-status">
            <div class="status-dot"></div>
            <span>Sistema activo</span>
        </div>
    </div>
</nav>

<main class="wrap">

    <!-- SCANNER -->
    <div class="card">
        <div class="card-head">
            <div class="card-head-icon"></div>
            <span class="card-head-label">Escáner · Número de guía</span>
        </div>
        <div class="card-body">
            <div class="scan-row">
                <input type="text" id="guiaInput" class="scan-input" placeholder="Ej: 1000119384" autofocus>
                <button id="marcarBtn" class="btn btn-primary">
                    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>
                    Marcar devuelta
                </button>
                <button id="limpiarBtn" class="btn btn-ghost">
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M18 6L6 18M6 6l12 12"/></svg>
                    Limpiar
                </button>
            </div>
        </div>
    </div>

    <!-- ÚLTIMO MARCAJE -->
    <div id="lastScanCard" class="card" style="display:none;">
        <div class="card-head">
            <div class="card-head-icon" style="background:var(--green);"></div>
            <span class="card-head-label">Último marcaje</span>
        </div>
        <div class="scan-fields">
            <div class="sf">
                <div class="sf-label">Guía</div>
                <div class="sf-value is-guia" id="lastGuiaSpan">—</div>
            </div>
            <div class="sf">
                <div class="sf-label">Distribuidor</div>
                <div class="sf-value" id="lastDistribuidor">—</div>
            </div>
            <div class="sf">
                <div class="sf-label">Proveedor</div>
                <div class="sf-value" id="lastProveedor">—</div>
            </div>
            <div class="sf">
                <div class="sf-label">Cliente</div>
                <div class="sf-value" id="lastCliente">—</div>
            </div>
            <div class="sf">
                <div class="sf-label">Producto</div>
                <div class="sf-value" id="lastProducto">—</div>
            </div>
            <div class="sf" style="border-right:none;">
                <div class="sf-label">Estado</div>
                <div id="lastEstado"><span class="badge badge-ok">✅ Devuelta</span></div>
            </div>
        </div>
    </div>

    <!-- ACCIONES + STATS -->
    <div class="card">
        <div class="card-body">
            <div class="actions-bar">
                <div class="btn-group">
                    <button id="loadFileBtn" class="btn btn-outline">
                        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
                        Cargar Excel
                    </button>
                    <button id="exportBtn" class="btn btn-green">
                        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                        Exportar devueltas
                    </button>
                    <button id="resetBtn" class="btn btn-red">
                        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 101.27-4.37L1 10"/></svg>
                        Reiniciar
                    </button>
                </div>
                <div class="stats-strip">
                    <div class="stat">
                        <span class="stat-n" id="totalCount">0</span>
                        <span class="stat-lbl">Total</span>
                    </div>
                    <div class="stat">
                        <span class="stat-n clr-green" id="devueltasCount">0</span>
                        <span class="stat-lbl">Devueltas</span>
                    </div>
                    <div class="stat">
                        <span class="stat-n clr-amber" id="pendientesCount">0</span>
                        <span class="stat-lbl">Pendientes</span>
                    </div>
                </div>
            </div>
            <div class="progress-row">
                <div class="progress-track">
                    <div class="progress-bar" id="progressBar"></div>
                </div>
                <span class="progress-pct" id="progressPct">0%</span>
            </div>
        </div>
    </div>

    <!-- TABLA -->
    <div class="card">
        <div class="card-head">
            <div class="card-head-icon" style="background:var(--gray-400);"></div>
            <span class="card-head-label">Registros</span>
        </div>
        <div class="card-body" style="padding:16px;">
            <div class="tbl-wrap">
                <table id="dataTable">
                    <thead id="tableHeader"></thead>
                    <tbody id="tableBody">
                        <tr><td colspan="10" style="padding:0;border:none;">
                            <div class="empty">
                                <div class="empty-ico">📂</div>
                                <div class="empty-t">Sin datos cargados</div>
                                <div class="empty-s">Cargue un archivo Excel para comenzar</div>
                            </div>
                        </td></tr>
                    </tbody>
                </table>
            </div>

            <!-- AUDITORÍA -->
            <div class="log-wrap">
                <div class="log-head">
                    <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="#475569" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
                    <span class="log-head-lbl">Auditoría</span>
                </div>
                <div class="log-body">
                    <div id="logEntries" style="font-family:var(--mono);font-size:0.66rem;color:#334155;">Sin registros</div>
                </div>
            </div>
        </div>
    </div>

</main>

<script>
    let workbookOriginal=null, sheetName="", worksheetOriginal=null;
    let originalRowsData=[], headers=[], devolutionSet=new Set(), auditLog=[];

    const guiaInput=document.getElementById('guiaInput');
    const marcarBtn=document.getElementById('marcarBtn');
    const limpiarBtn=document.getElementById('limpiarBtn');
    const loadFileBtn=document.getElementById('loadFileBtn');
    const exportBtn=document.getElementById('exportBtn');
    const resetBtn=document.getElementById('resetBtn');
    const tableHeader=document.getElementById('tableHeader');
    const tableBody=document.getElementById('tableBody');
    const lastScanCard=document.getElementById('lastScanCard');
    const lastGuiaSpan=document.getElementById('lastGuiaSpan');
    const lastDistribuidor=document.getElementById('lastDistribuidor');
    const lastProveedor=document.getElementById('lastProveedor');
    const lastCliente=document.getElementById('lastCliente');
    const lastProducto=document.getElementById('lastProducto');
    const lastEstado=document.getElementById('lastEstado');
    const totalCountSpan=document.getElementById('totalCount');
    const devueltasCountSpan=document.getElementById('devueltasCount');
    const pendientesCountSpan=document.getElementById('pendientesCount');
    const progressBar=document.getElementById('progressBar');
    const progressPct=document.getElementById('progressPct');
    const logEntriesDiv=document.getElementById('logEntries');

    function showToast(msg, type='ok'){
        const t=document.createElement('div');
        t.className=`toast toast-${type}`;
        t.innerHTML=msg;
        document.body.appendChild(t);
        setTimeout(()=>{ t.style.transition='opacity .25s'; t.style.opacity='0'; setTimeout(()=>t.remove(),270); },2700);
    }

    function saveLogs(){ localStorage.setItem('effi_dev_log',JSON.stringify(auditLog.slice(-200))); }
    function loadLogs(){
        try{ const s=localStorage.getItem('effi_dev_log'); if(s){ auditLog=JSON.parse(s); renderLogs(); } }catch(e){}
    }
    function addLog(guia,dist,prov,cliente,prod,action){
        auditLog.unshift({ts:new Date().toLocaleString('es-CR'),guia,dist,prov,cliente,prod,action});
        if(auditLog.length>300) auditLog.pop();
        renderLogs(); saveLogs();
    }
    function renderLogs(){
        if(!auditLog.length){ logEntriesDiv.innerHTML='<span style="color:#1e293b">Sin registros</span>'; return; }
        logEntriesDiv.innerHTML=auditLog.slice(0,60).map(l=>{
            const cls=l.action.includes('MARCADA')?'log-ok':'log-er';
            return `<div class="log-row"><span class="log-ts">[${l.ts}]</span> <span class="${cls}">${l.action}</span> — <span class="log-gu">Guía: ${l.guia}</span> | ${l.cliente}</div>`;
        }).join('');
    }

    function saveMarks(){ localStorage.setItem('effi_dev_marks',JSON.stringify([...devolutionSet])); }
    function loadMarks(){
        try{ const s=localStorage.getItem('effi_dev_marks'); if(s){ devolutionSet.clear(); JSON.parse(s).forEach(m=>devolutionSet.add(m)); } }catch(e){}
    }

    function updateStats(){
        const total=originalRowsData.length, dev=devolutionSet.size, pend=total-dev;
        const pct=total>0?Math.round(dev/total*100):0;
        totalCountSpan.innerText=total;
        devueltasCountSpan.innerText=dev;
        pendientesCountSpan.innerText=pend;
        progressBar.style.width=pct+'%';
        progressPct.innerText=pct+'%';
    }

    function showLastScan(guia,dist,prov,cliente,prod,marcada){
        lastGuiaSpan.innerText=guia;
        lastDistribuidor.innerText=dist||'—';
        lastProveedor.innerText=prov||'—';
        lastCliente.innerText=cliente||'—';
        lastProducto.innerText=prod||'—';
        lastEstado.innerHTML=marcada
            ?'<span class="badge badge-ok">✅ Devuelta</span>'
            :'<span class="badge badge-pend">⏳ Pendiente</span>';
        lastScanCard.style.display='block';
    }

    function renderTable(){
        if(!originalRowsData.length){
            tableBody.innerHTML=`<tr><td colspan="99" style="padding:0;border:none;"><div class="empty"><div class="empty-ico">📂</div><div class="empty-t">Sin datos cargados</div><div class="empty-s">Cargue un archivo Excel para comenzar</div></div></td></tr>`;
            return;
        }
        const sorted=[...originalRowsData].sort((a,b)=>{
            const dA=devolutionSet.has(String(a['Guía transportadora']||''));
            const dB=devolutionSet.has(String(b['Guía transportadora']||''));
            return dA===dB?0:dA?-1:1;
        });
        tableBody.innerHTML=sorted.map(row=>{
            const guia=row['Guía transportadora']!==undefined?String(row['Guía transportadora']):'';
            const isDev=devolutionSet.has(guia);
            const cells=headers.map(h=>`<td>${esc(String(row[h]??''))}</td>`).join('');
            return `<tr class="${isDev?'row-dev':''}"><td style="text-align:center"><input type="checkbox" class="chk" data-guia="${esc(guia)}" ${isDev?'checked':''}></td>${cells}</tr>`;
        }).join('');

        document.querySelectorAll('.chk').forEach(cb=>{
            cb.addEventListener('change',()=>{
                const g=cb.getAttribute('data-guia'); if(!g) return;
                const r=originalRowsData.find(x=>String(x['Guía transportadora'])===g);
                const dist=r?.['Distribuidor']||'';
                const prov=r?.['Proveedor Dropshipping']||'';
                const cliente=r?.['Destinatario']||'Desconocido';
                const prod=r?.['Descripción original artículo']||r?.['ID artículo']||'Producto';
                if(cb.checked){
                    devolutionSet.add(g);
                    addLog(g,dist,prov,cliente,prod,'✅ MARCADA');
                    showLastScan(g,dist,prov,cliente,prod,true);
                    showToast(`Guía <strong>${g}</strong> marcada`,'ok');
                } else {
                    devolutionSet.delete(g);
                    addLog(g,dist,prov,cliente,prod,'❌ DESMARCADA');
                    showLastScan(g,dist,prov,cliente,prod,false);
                    showToast(`Guía <strong>${g}</strong> desmarcada`,'inf');
                }
                saveMarks(); renderTable(); updateStats();
            });
        });
        updateStats();
    }

    function initTable(){
        if(!originalRowsData.length) return;
        tableHeader.innerHTML=`<tr><th style="width:46px;text-align:center;">✔</th>${headers.map(h=>`<th>${esc(h)}</th>`).join('')}</tr>`;
        renderTable();
    }

    function marcarGuia(raw){
        const guia=String(raw).trim();
        if(!guia){ showToast('Ingrese un número de guía','err'); guiaInput.focus(); return false; }
        const r=originalRowsData.find(x=>String(x['Guía transportadora'])===guia);
        if(!r){ showToast(`Guía <strong>${guia}</strong> no encontrada`,'err'); guiaInput.value=''; guiaInput.focus(); return false; }
        const dist=r['Distribuidor']||'';
        const prov=r['Proveedor Dropshipping']||'';
        const cliente=r['Destinatario']||'Desconocido';
        const prod=r['Descripción original artículo']||r['ID artículo']||'Producto';
        if(!devolutionSet.has(guia)){
            devolutionSet.add(guia);
            addLog(guia,dist,prov,cliente,prod,'✅ MARCADA (escáner)');
            showLastScan(guia,dist,prov,cliente,prod,true);
            showToast(`Guía <strong>${guia}</strong> marcada`,'ok');
            renderTable(); saveMarks();
        } else {
            showLastScan(guia,dist,prov,cliente,prod,true);
            showToast(`Guía <strong>${guia}</strong> ya estaba marcada`,'inf');
        }
        guiaInput.value=''; guiaInput.focus(); return true;
    }

    function loadExcelFile(){
        const inp=document.createElement('input');
        inp.type='file'; inp.accept='.xlsx,.xls';
        inp.onchange=e=>{
            const file=e.target.files[0]; if(!file) return;
            const reader=new FileReader();
            reader.onload=evt=>{
                const wb=XLSX.read(new Uint8Array(evt.target.result),{type:'array',cellStyles:true});
                workbookOriginal=wb; sheetName=wb.SheetNames[0]; worksheetOriginal=wb.Sheets[sheetName];
                const json=XLSX.utils.sheet_to_json(worksheetOriginal,{defval:""});
                if(!json.length){ alert("Excel sin datos"); return; }
                const sh=XLSX.utils.sheet_to_json(worksheetOriginal,{header:1})[0];
                headers=sh?[...sh]:Object.keys(json[0]);
                originalRowsData=json.map(row=>{ const nr={}; headers.forEach(h=>nr[h]=row[h]??''); return nr; });
                loadMarks(); initTable();
                lastScanCard.style.display='none';
                updateStats();
                showToast(`${originalRowsData.length} registros cargados`,'ok');
            };
            reader.onerror=()=>alert("Error leyendo archivo");
            reader.readAsArrayBuffer(file);
        };
        inp.click();
    }

    function exportDevueltas(){
        if(!workbookOriginal){ showToast('Primero cargue un archivo','err'); return; }
        if(!devolutionSet.size){ showToast('No hay guías marcadas','err'); return; }
        if(!confirm(`¿Exportar ${devolutionSet.size} filas marcadas?`)) return;
        const rows=XLSX.utils.sheet_to_json(worksheetOriginal,{header:1,defval:""});
        if(!rows.length) return;
        const hrow=rows[0];
        const gIdx=hrow.findIndex(h=>String(h).trim()==='Guía transportadora');
        if(gIdx<0){ alert("No se encontró columna 'Guía transportadora'"); return; }
        const out=[hrow,...rows.slice(1).filter(r=>devolutionSet.has(String(r[gIdx]??'').trim()))];
        const ws=XLSX.utils.aoa_to_sheet(out);
        if(worksheetOriginal['!cols']) ws['!cols']=[...worksheetOriginal['!cols']];
        if(worksheetOriginal['!merges']) ws['!merges']=[...worksheetOriginal['!merges']];
        const wb2=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb2,ws,sheetName);
        XLSX.writeFile(wb2,`devoluciones_${new Date().toISOString().slice(0,19).replace(/:/g,'-')}.xlsx`);
        showToast(`${devolutionSet.size} filas exportadas`,'ok');
    }

    function resetAll(){
        if(!originalRowsData.length) return;
        if(!confirm('¿Reiniciar todas las marcas?')) return;
        devolutionSet.clear();
        addLog('SISTEMA','','','Admin','Todas','🔄 REINICIO');
        renderTable(); lastScanCard.style.display='none';
        saveMarks(); guiaInput.focus();
        showToast('Marcas reiniciadas','inf');
    }

    function esc(s){ return String(s||'').replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m])); }

    marcarBtn.addEventListener('click',()=>marcarGuia(guiaInput.value));
    guiaInput.addEventListener('keypress',e=>{ if(e.key==='Enter'){ e.preventDefault(); marcarGuia(guiaInput.value); } });
    limpiarBtn.addEventListener('click',()=>{ guiaInput.value=''; guiaInput.focus(); });
    loadFileBtn.addEventListener('click',loadExcelFile);
    exportBtn.addEventListener('click',exportDevueltas);
    resetBtn.addEventListener('click',resetAll);
    document.addEventListener('keydown',e=>{
        if(e.ctrlKey&&e.key==='k'){ e.preventDefault(); limpiarBtn.click(); }
        if(e.ctrlKey&&e.key==='e'){ e.preventDefault(); exportBtn.click(); }
        if(e.ctrlKey&&e.key==='r'){ e.preventDefault(); resetBtn.click(); }
    });

    loadLogs();
    guiaInput.focus();
</script>
</body>
</html>
